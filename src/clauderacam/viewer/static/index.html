<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ClauderaCAM viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #ddd;
               font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  #panel { position: absolute; top: 12px; left: 12px; background: #1d2026e6;
           border: 1px solid #333; border-radius: 8px; padding: 12px 14px;
           min-width: 260px; backdrop-filter: blur(4px); }
  #panel h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
  #verdict { font-weight: 700; margin: 4px 0 8px; }
  .ok   { color: #6fdc8c; }
  .fail { color: #ff6b6b; }
  .check { display: flex; justify-content: space-between; gap: 12px;
           padding: 1px 0; white-space: nowrap; }
  .check .v { color: #9aa3b2; }
  #live { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
          background: #6fdc8c; margin-right: 6px;
          animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #zrow { margin-top: 10px; display: flex; align-items: center; gap: 8px;
          color: #9aa3b2; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center;
           justify-content: center; color: #667; font-size: 15px; }
</style>
<script type="importmap">
  { "imports": { "three": "/static/three.module.js" } }
</script>
</head>
<body>
<div id="empty">waiting for a simulation… (run the verify or view tool)</div>
<div id="panel" style="display:none">
  <h1><span id="live"></span><span id="jobname">–</span></h1>
  <div id="verdict"></div>
  <div id="checks"></div>
  <div id="zrow">z× <input id="zex" type="range" min="1" max="4" step="0.1"
       value="1" style="flex:1"> <span id="zexv">1.0</span></div>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
