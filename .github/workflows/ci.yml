name: ci
on: [push, pull_request]
jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y gerbv
      - run: python -m pip install -e . ./kernel
      - name: kernel parity (rust vs python reference)
        run: python tests/kernel_parity.py
      - name: golden (byte-identical toolpaths + full program + verify)
        run: python tests/golden_mango.py
      - name: reference suite (4 synthetic jobs end-to-end)
        run: python tests/reference_suite.py
      - name: negative controls (24 hazards must be caught)
        run: python tests/negative_suite.py
      - name: stage model (per-stage snapshots, stats, viewer payload)
        run: python tests/stage_model.py
      - name: viewer sessions (discovery, push, join, open, 409 discipline)
        run: python tests/viewer_sessions.py
      - name: two-sided pin-and-flip (cross-side checks + negatives)
        run: python tests/twosided_suite.py
      - name: pcb tools (vee cone, scrub exemption, laser dialect)
        run: python tests/pcb_tools_suite.py
      - name: pcb ground truth (gerbv rasters, excellon, transforms)
        run: python tests/pcb_groundtruth_suite.py
      - name: pcb engine (grammar gate, templated tcl, param-match law)
        run: python tests/pcb_engine_suite.py
      - name: pcb checks (iso/clear/scrub/silk/holes/cutout, 19 hazards caught)
        run: python tests/pcb_checks_suite.py
  test-python-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: golden on the pure-python kernel (no rust required)
        run: python tests/golden_mango.py
      - name: negative controls on the pure-python kernel
        run: python tests/negative_suite.py
      - name: stage model on the pure-python kernel
        run: python tests/stage_model.py
      - name: viewer sessions on the pure-python kernel
        run: python tests/viewer_sessions.py
      - name: two-sided pin-and-flip on the pure-python kernel
        run: python tests/twosided_suite.py
      - name: pcb tools on the pure-python kernel
        run: python tests/pcb_tools_suite.py
      - name: pcb ground truth without gerbv (must skip loudly, not fail)
        run: python tests/pcb_groundtruth_suite.py
      - name: pcb engine on the pure-python kernel
        run: python tests/pcb_engine_suite.py
      - name: pcb checks without gerbv (raster sections must skip loudly)
        run: python tests/pcb_checks_suite.py
