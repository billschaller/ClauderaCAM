name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: golden (byte-identical toolpaths + full program + verify)
        run: python tests/golden_mango.py
      - name: reference suite (4 synthetic jobs end-to-end)
        run: python tests/reference_suite.py
      - name: negative controls (17 hazards must be caught)
        run: python tests/negative_suite.py
