# The tool crib — the machine's PHYSICAL tool inventory (Article XI).
#
# A job may only use tools that match an entry here: same type, diameter,
# shank and flute count, claimed reach no longer than the entry's, quantity
# on hand. A tool the shop does not hold refuses to LOAD — born from the
# 2026-07-28 incident where a config carried an invented 14mm drill reach
# and sent the operator hunting for a bit that does not exist.
#
# Provenance: hand-mirrored from the operator's inventory app
# (~/scratch/carvera/inventory, counted 2026-07-19), geometry from the
# bit descriptions and the metal-validated job set. Entries whose reach is
# NOT known are deliberately absent (TiN drills 2.5/3.0, PCB micro drills,
# sub-2mm corn bits): measure, then add — never guess. Conical bits
# (chamfer/engraving V-tips) are unsupported by the simulator and have no
# place here yet.

