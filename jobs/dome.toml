# Reference: smooth gaussian dome — 2mm flat rough (smaller rough tool relaxes
# the slope budget), full two-ball finishing chain, no cutout.

[job]
name = "dome"
stl = "../assets/generated/dome.stl"
out = "../out/dome.nc"

[stock]
size = 32.0
thickness = 3.2

[model]
radius = 12.0
skim = 0.15
floor_z = -1.95

[fixture]
keepout_radius = 14.5

[[tool]]
num = 3
type = "flat"
diameter = 2.0
rpm = 12000

[[tool]]
num = 2
type = "ball"
diameter = 2.0
rpm = 12000

[[tool]]
num = 4
type = "ball"
diameter = 1.0
rpm = 12000

[[op]]
kind = "rough"
tool = 3
stepdown = 0.2
stepover = 1.2
allowance = 0.2
boundary_r = 13.2
map_half = 14.5
grid = 0.1
simplify = 0.01
feed = 300
plunge = 150

[[op]]
kind = "raster"
label = "semi"
tool = 2
stepover = 0.30
offset = 0.05
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[op]]
kind = "raster"
label = "finish"
tool = 4
stepover = 0.09
offset = 0.0
axis = "y"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200
