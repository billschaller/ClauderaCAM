# Reference: stepped cone — layered-rough terracing, simplify on flats,
# ball engagement on 0.22mm step walls, spiral cutout with tabs.

[job]
name = "terraces"
stl = "../assets/generated/terraces.stl"
out = "../out/terraces.nc"

[stock]
size = 40.0
thickness = 3.2

[material]
name = "brass"   # physics limits from the material table in physics.py

[model]
radius = 15.0
skim = 0.15
floor_z = -2.35

[fixture]
keepout_radius = 18.5

[[tool]]
num = 1
type = "flat"
diameter = 3.175
rpm = 12000
flutes = 1
flute_length = 12.0
shank_diameter = 3.175

[[tool]]
num = 2
type = "ball"
diameter = 2.0
rpm = 12000
flutes = 2
flute_length = 6.0
shank_diameter = 3.175

[[tool]]
num = 4
type = "ball"
diameter = 1.0
rpm = 12000
flutes = 2
flute_length = 3.0
shank_diameter = 3.175

[[op]]
kind = "rough"
tool = 1
stepdown = 0.2
stepover = 1.905
allowance = 0.2
boundary_r = 16.7
map_half = 18.5
grid = 0.1
simplify = 0.01
feed = 300
plunge = 150

[[op]]
kind = "raster"
label = "semi"
tool = 2
stepover = 0.30
offset = 0.05
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[op]]
kind = "raster"
label = "finish"
tool = 4
stepover = 0.10
offset = 0.0
axis = "y"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[op]]
kind = "cutout"
tool = 1
z_start = -2.0
z_final = -3.35
ramp = 0.15
tabs = [45, 135, 225, 315]
tab_width = 2.0
tab_top = -2.7
seg = 128
feed = 300
plunge = 150
