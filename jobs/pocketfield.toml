# Reference: graduated access — which TOOL BODY fits into which feature.
#   big pocket Ø7      rough (2mm flat) enters and clears to allowance
#   pocket Ø2.2        2mm tool bodies fit; the rough footprint barely does
#   pocket Ø1.8        no 2mm BODY fits — but measure before you believe a
#                      stronger claim: these features are so shallow
#                      (0.22–0.28mm) that the 2mm ball's contact circle
#                      (Ø1.25 at 0.22mm depth) bottoms them out anyway; the
#                      1mm finish only removes the last 0.05mm allowance
#   slots 1.3 / 1.5mm  same story — depths sized so every tool's true
#                      contact stays under the engagement limit
# TRUE tool exclusion needs features deeper than a ball's penetration at the
# feature width, which the 0.5mm engagement limit forbids in a single pass —
# that demo requires depth-stepped clearing (roadmap op). The 2026-07-28
# review caught this file overclaiming ("only the 1mm ball reaches the
# floor"); the simulator itself disproved it.

[job]
name = "pocketfield"
stl = "../assets/generated/pocketfield.stl"
out = "../out/pocketfield.nc"

[stock]
size = 40.0
thickness = 3.2

[material]
name = "brass"   # physics limits from the material table in physics.py

[model]
radius = 16.0
skim = 0.15
floor_z = -0.7

# keep-out must clear every op's reach incl. grid/2 row overshoot:
# rough 17.1+1.0+0.05=18.15, ball rasters 16+1+1+0.025=18.025 <= cleared 18.1
[fixture]
keepout_radius = 18.2

[[tool]]
num = 3
type = "flat"
diameter = 2.0
rpm = 12000
flutes = 2
flute_length = 6.0
shank_diameter = 3.175

[[tool]]
num = 2
type = "ball"
diameter = 2.0
rpm = 12000
flutes = 2
flute_length = 6.0
shank_diameter = 3.175

[[tool]]
num = 4
type = "ball"
diameter = 1.0
rpm = 12000
flutes = 2
flute_length = 3.0
shank_diameter = 3.175

[[op]]
kind = "rough"
tool = 3
stepdown = 0.2
stepover = 1.2
allowance = 0.15
boundary_r = 17.1
map_half = 18.2
grid = 0.1
simplify = 0.01
feed = 300
plunge = 150

[[op]]
kind = "raster"
label = "semi"
tool = 2
stepover = 0.30
offset = 0.05
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[op]]
kind = "raster"
label = "finish"
tool = 4
stepover = 0.09
offset = 0.0
axis = "y"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200
