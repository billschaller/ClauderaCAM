# The two-sided mango coin — Ø44, brass, machined front AND back with
# pin-and-flip registration (designed 2026-07-28; decisions in DESIGN.md).
#
# LOCAL-ASSET JOB (Ø44 models, 2026-07-28): STLs in the operator's home (~130-190MB
# each) and are not part of the repo; CI does not run this job — the
# committed twoside-ref job covers the mode.
#
# Physical setup: 63.75mm square brass blank, 3.2mm, on 1/2" MDF
# spoilboard. Side 1 machines the front art + moat, spot-faces and
# burr-skims then peck-drills two Ø2 holes at (0, ±27.5) through the
# brass into the MDF (2x12mm twist drill, Spare Tools case; pins end
# ~0.6 proud of the flipped face — approved). Flip LEFT-RIGHT (about the Y
# axis) onto two Ø2×12 dowel pins. Side 2 machines the back art + moat,
# then cuts out with tabs. Tabs snap by hand.

[job]
name = "mango2"
out_front = "../out/mango2-front.nc"
out_back = "../out/mango2-back.nc"

[stock]
size = 63.75
thickness = 3.2

[spoilboard]
thickness = 12.7

[material]
name = "brass"

[fixture]
keepout_radius = 29.5

[model]
radius = 22.0
skim = 0.15
z = "relief"        # STLs are z-up reliefs (base 0); floor_z derived

[twosided]
front_stl = "~/mango_coin_front.stl"
back_stl = "~/mango_coin_back.stl"
flip_axis = "y"

[pins]
diameter = 2.0
length = 12.0
positions = [[0.0, 27.5], [0.0, -27.5]]
drill_tool = 5
spot_tool = 1
spot_depth = 0.1   # burr skim: the drill's entry burr sits below the
                   # face that rests on the spoilboard after the flip
spot_feed = 60
seat_extra = -0.6  # pin sits ~0.6 PROUD of the side-2 face — operator
                   # approved 2026-07-28. Hole depth = 12+(-0.6)+0.6 =
                   # 12.0, inside the 2x12 drill's native reach: no
                   # counterbore needed. Rapids clear the pin by 2.4;
                   # nearest side-2 cutting is 1.2mm away laterally.
peck = 0.8
feed = 120

[[tool]]
num = 1
type = "flat"
diameter = 3.175
rpm = 12000
flutes = 1
flute_length = 12.0
shank_diameter = 3.175

[[tool]]
num = 2
type = "ball"
diameter = 2.0
rpm = 12000
flutes = 2
flute_length = 6.0
shank_diameter = 3.175

[[tool]]
num = 4
type = "ball"
diameter = 1.0
rpm = 12000
flutes = 2
flute_length = 3.0
shank_diameter = 3.175

[[tool]]
num = 5
type = "drill"
diameter = 2.0
rpm = 10000
flutes = 2
flute_length = 12.0   # the operator's actual bit: 2x12mm on 1/8" shank —
                      # confirm the flutes really run 12mm to the step
shank_diameter = 3.175

# ---------------------------------------------------------------- side 1
[[side.front.op]]
kind = "rough"
tool = 1
stepdown = 0.2
stepover = 1.905
allowance = 0.2
boundary_r = 22.6     # art + moat only; the ring stays full thickness
map_half = 24.5
grid = 0.1
simplify = 0.01
feed = 300
plunge = 150

[[side.front.op]]
kind = "raster"
label = "semi"
tool = 2
stepover = 0.30
offset = 0.05
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[side.front.op]]
kind = "raster"
label = "finish"
tool = 4
stepover = 0.09
offset = 0.0
axis = "y"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[side.front.op]]
kind = "raster"
label = "polish"       # cross-pass at 90°: kills directional ridging;
tool = 4               # removes ~nothing (re-cuts the finish scallops)
stepover = 0.09
offset = 0.0
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

# ---------------------------------------------------------------- side 2
[[side.back.op]]
kind = "rough"
tool = 1
stepdown = 0.2
stepover = 1.905
allowance = 0.2
boundary_r = 23.7     # wider moat: must clear the cutout slot's reach
map_half = 25.5
grid = 0.1
simplify = 0.01
feed = 300
plunge = 150

[[side.back.op]]
kind = "raster"
label = "semi"
tool = 2
stepover = 0.30
offset = 0.05
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[side.back.op]]
kind = "raster"
label = "finish"
tool = 4
stepover = 0.09
offset = 0.0
axis = "y"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[side.back.op]]
kind = "raster"
label = "polish"       # cross-pass at 90° (see front side)
tool = 4
stepover = 0.09
offset = 0.0
axis = "x"
grid = 0.05
margin = 1.6
bound_extra = 1.0
simplify = 0.005
feed = 500
plunge = 200

[[side.back.op]]
kind = "cutout"
tool = 1
z_start = -1.0
z_final = -3.35
ramp = 0.15
tabs = [45, 135, 225, 315]
tab_width = 2.0
tab_bridge = 0.5    # bench 2026-07-29: the hand-picked tab_top -1.55 left
                    # 0.241 bridges — "a hair too thin". tab_top is now
                    # derived (-t - front floor + bridge = -1.297). 0.5 is
                    # this coin's ceiling minus margin: the edge is only
                    # 0.527 thick (moats 1.403 + 1.270 of 3.2 stock — the
                    # art fades before r=22, the rim flange Bill sanded
                    # off). Regenerate STLs with relief to the rim to
                    # unlock the 0.6 default.
seg = 128
feed = 300
plunge = 150
