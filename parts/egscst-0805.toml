# EGSCST 0805 SMD assortment book — 5600 pcs, 236 values.
# Transcribed 2026-07-29 from Amazon listing B0DZXQPFHP gallery images
# (master table 81TJTOTQxuL.jpg, cross-checked against pouch-label
# photos). See parts/README.md for method and status semantics.

[book]
brand = "EGSCST"
package = "0805"                # 2.0 x 1.2 mm
pieces = 5600
values = 236
status = "listing-transcribed"  # verify pulled values against the
                                # physical book at BOM time
extras = ["soldering tip x1", "tweezers x1", "solder wire x2",
          "rubber band x1"]

[resistors]
tolerance = "1%"
series = "E24"                  # full E24, 7 decades
range = ["0", "10M"]            # 0R + 1R..9.1R .. 1M..9.1M + 10M
values_count = 170
per_value = 25                  # derived: 4250/170 (not printed)

# capacitors: the decoupling/bulk book — the ONLY book with >=100nF.
[[cap]]
value = "22pF"
code = "220K"
voltage = "50V"
dielectric = "X7R"

