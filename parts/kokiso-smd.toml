# KOKISO 500-piece SMD kit — 50 values x 10: 15 diodes, 20 BJTs,
# 15 MOSFETs, SOT-23 class. Transcribed 2026-07-29 from the Amazon
# listing gallery (https://a.co/d/07CQUW5y): master catalog
# 612hjVgqaLS.jpg, per-species packet sheets, bag-label and top-marking
# photos cross-checked. See parts/README.md for method and status.

[kit]
brand = "KOKISO"
pieces = 500
values = 50
per_value = 10
status = "listing-transcribed"  # bench-verify at BOM time

